<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Receituário — Biovetfarma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    :root {
      --teal:      #3CB3C0;
      --teal-dark: #1A7175;
      --teal-deep: #145a5e;
      --bg:        #f4fbfc;
      --surface:   #ffffff;
      --text:      #1A3A3D;
      --text-soft: #4d7c80;
      --border:    #c8e2e5;
      --font:      'Nunito', sans-serif;
      --shadow-md: 0 4px 14px rgba(20,90,94,0.08), 0 2px 6px rgba(20,90,94,0.04);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0 24px;
    }
    header img { height: 44px; }

    .card {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      padding: 32px 28px;
      width: 100%;
      max-width: 600px;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-weight: 700;
      font-size: 1rem;
    }
    .badge--ok {
      background: #e8f8f0;
      color: #15803d;
      border: 1.5px solid #86efac;
    }
    .badge--erro {
      background: #fef2f2;
      color: #b91c1c;
      border: 1.5px solid #fca5a5;
    }
    .badge__icon { font-size: 1.6rem; flex-shrink: 0; }

    .badge__title { font-size: 1rem; font-weight: 800; }
    .badge__sub   { font-size: 0.82rem; font-weight: 600; opacity: 0.8; margin-top: 2px; }

    .secao { margin-bottom: 20px; }
    .secao__titulo {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .secao__valor {
      font-size: 0.97rem;
      font-weight: 600;
      color: var(--text);
    }

    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    #loading-state {
      text-align: center;
      color: var(--text-soft);
      padding: 32px 0;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: var(--text-soft);
      text-align: center;
    }
    footer a { color: var(--teal-dark); text-decoration: none; font-weight: 700; }

    #resultado-state { display: none; }
  </style>
</head>
<body>

  <header>
    <img src="/assets/logo-biovetfarma.png" alt="Biovetfarma">
  </header>

  <div class="card">
    <div id="loading-state">
      <div class="spinner"></div>
      <p>Verificando receituário...</p>
    </div>

    <div id="resultado-state">
      <div id="badge-container"></div>
      <div id="dados-container"></div>
    </div>
  </div>

  <footer>
    <p>Emitido pela plataforma <a href="https://app.biovetfarma.com.br">Biovetfarma</a></p>
    <p style="margin-top:4px">Este documento possui validade legal. Em caso de dúvidas, contate o médico veterinário.</p>
  </footer>

  <script type="module">
    import { initializeApp }   from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey:            "AIzaSyCW2HG6ECzk6OD0cenYqY1R3rsJ1Oecgek",
      authDomain:        "biovet-parceiro-vet.firebaseapp.com",
      projectId:         "biovet-parceiro-vet",
      storageBucket:     "biovet-parceiro-vet.firebasestorage.app",
      messagingSenderId: "549792200166",
      appId:             "1:549792200166:web:0cf14a3895227b79031227"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db    = getFirestore(fbApp);

    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatarData(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function campo(label, valor) {
      return `
        <div class="secao">
          <div class="secao__titulo">${esc(label)}</div>
          <div class="secao__valor">${esc(valor || '—')}</div>
        </div>`;
    }

    async function verificar() {
      const params = new URLSearchParams(window.location.search);
      const id     = params.get('id');

      const loadEl     = document.getElementById('loading-state');
      const resultEl   = document.getElementById('resultado-state');
      const badgeEl    = document.getElementById('badge-container');
      const dadosEl    = document.getElementById('dados-container');

      if (!id) {
        loadEl.style.display = 'none';
        resultEl.style.display = 'block';
        badgeEl.innerHTML = `
          <div class="badge badge--erro">
            <span class="badge__icon">❌</span>
            <div>
              <div class="badge__title">ID não informado</div>
              <div class="badge__sub">Acesse este link pelo QR Code do receituário.</div>
            </div>
          </div>`;
        return;
      }

      try {
        const snap = await getDoc(doc(db, 'receituarios', id));

        loadEl.style.display = 'none';
        resultEl.style.display = 'block';

        if (!snap.exists()) {
          badgeEl.innerHTML = `
            <div class="badge badge--erro">
              <span class="badge__icon">❌</span>
              <div>
                <div class="badge__title">Receituário não encontrado ou inválido</div>
                <div class="badge__sub">Este documento não está registrado no sistema Biovetfarma.</div>
              </div>
            </div>`;
          return;
        }

        const r = snap.data();

        badgeEl.innerHTML = `
          <div class="badge badge--ok">
            <span class="badge__icon">✅</span>
            <div>
              <div class="badge__title">Receituário Autêntico</div>
              <div class="badge__sub">Documento verificado e registrado na plataforma Biovetfarma.</div>
            </div>
          </div>`;

        dadosEl.innerHTML = `
          ${campo('Número do Receituário', id)}
          ${campo('Data de Emissão', formatarData(r.dataEmissao))}
          <hr>
          ${campo('Médico Veterinário', r.vetNome)}
          ${campo('CRMV', r.vetCrmv)}
          <hr>
          ${campo('Paciente', r.pacienteNome)}
          ${campo('Espécie / Raça', [r.pacienteEspecie, r.pacienteRaca].filter(Boolean).join(' / '))}
          ${campo('Peso', r.pacientePeso ? `${r.pacientePeso} kg` : '—')}
          ${campo('Tutor / Proprietário', r.tutorNome)}
          <hr>
          ${campo('Medicamento', r.medicamentoNome)}
          ${campo('Princípio Ativo', r.principioAtivo)}
          ${campo('Dose Calculada', r.doseCalculada)}
          ${campo('Posologia', r.posologia)}
          ${campo('Via de Administração', r.via)}
          ${r.observacoes ? campo('Observações', r.observacoes) : ''}
        `;

      } catch (err) {
        console.error(err);
        loadEl.style.display = 'none';
        resultEl.style.display = 'block';
        badgeEl.innerHTML = `
          <div class="badge badge--erro">
            <span class="badge__icon">⚠️</span>
            <div>
              <div class="badge__title">Erro ao verificar</div>
              <div class="badge__sub">Verifique sua conexão e tente novamente.</div>
            </div>
          </div>`;
      }
    }

    verificar();
  </script>
</body>
</html>
